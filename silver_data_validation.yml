# ===========================================================================
# silver_data_validation.yml -- daftar dataset SILVER (cleaned & conformed)
# yang divalidasi lewat --config file ini, terpisah dari datasets.yml (gold)
# dan bronze_data_validation.yml/bronze_datasets.yml (bronze). Sama pola
# --config-nya untuk ketiga skrip inti:
#   python scaffold.py        --config silver_data_validation.yml --nama <ds> --s3 "..." --tempel
#   python build_reference.py --config silver_data_validation.yml --dataset <ds> --source s3
#   python validate.py        --config silver_data_validation.yml --dataset <ds> --source s3
#   python validate.py        --config silver_data_validation.yml --list
#
# ===========================================================================
# RIWAYAT PERBAIKAN (2026-09-08)
# ===========================================================================
#
# Revisi sebelumnya file ini adalah HASIL COPY-PASTE MENTAH dari
# bronze_data_validation.yml (header masih menyebut "BRONZE", tabel/nama
# dataset contoh masih punya nama-nama Bronze, dan referensi PDF masih ke
# bagian "LAYER BRONZE") -- sudah ditulis ulang di bawah supaya benar-benar
# mendeskripsikan Silver. Satu BUG KONKRET yang ikut ke-copy dan sudah
# diperbaiki: 'default.meta_audit.wajib' mewarisi '[_ingested_at]' dari
# bronze, padahal kolom audit di Silver namanya 'loaded_at' -- '_ingested_at'
# TIDAK PERNAH ADA di skema Silver manapun di file ini. Akibatnya Dimensi 12
# (LINEAGE AUDIT) akan GAGAL TERUS setiap run (mencari kolom yang memang
# tidak ada), bukan karena data rusak. Sudah diganti ke 'loaded_at' di blok
# default: di bawah.
#
# ===========================================================================
# DIMENSI YANG DIAKTIFKAN -- disesuaikan dengan docs/Panduan_Proses_Data_
# Validation.pdf bagian "2. LOGIKA DATA QUALITY: LAYER SILVER" (2026-09-08)
# ===========================================================================
#
# PDF mengaktifkan 6 dimensi utk Silver (validasi tingkat BARIS/micro, fokus
# "keutuhan data, validitas konten, kebersihan string, & kepatuhan aturan
# bisnis" -- beda dari Bronze yang fokus "tabel & berkas"):
#   1. Schema                 -- kolom kritis wajib pertahankan tipenya
#   4. Missingness             -- customer_id/order_id tidak boleh null/kosong
#   5. Uniqueness              -- kunci.bisnis tidak boleh duplikat
#   6. Integrity (business)    -- relasi antar kolom, mis. ship_date>=order_date
#   8. Cleanliness & Encoding  -- mojibake/karakter kontrol pada kolom string
#   10. Pattern Compliance     -- regex standar bisnis (email, no. telepon, dst)
#
# Dimensi 1/4/8 OTOMATIS aktif (bawaan mesin, tidak perlu di-set) -- lihat
# tabel anotasi per dataset di bawah untuk 5/6/10 yang butuh field eksplisit.
#
# ===========================================================================
# REVISI 2026-09-08 (kedua): DIPERSEMPIT KE PERSIS 6 DIMENSI PDF
# ===========================================================================
#
# Revisi SEBELUMNYA (di atas) sempat mempertahankan Dimensi 3/9/11/12
# (Freshness, Rekonsiliasi Sumber, Storage Safety, Lineage Audit) sebagai
# ekstensi sadar di luar permintaan PDF -- SEKARANG DICABUT atas permintaan
# user: Data Docs (gx/uncommitted/data_docs/) harus persis menampilkan 6
# dimensi yang diminta PDF, tidak lebih. Field YAML yang mengaktifkannya
# sudah DIHAPUS dari kedua dataset:
#   - kunci.waktu / kunci.waktu_muat        (mematikan Dimensi 3 FRESHNESS)
#   - sumber.sql_server                     (mematikan Dimensi 9 REKONSILIASI)
#   - ukuran_berkas.rentang                 (mematikan Dimensi 11 STORAGE SAFETY)
#   - meta_audit.wajib diset [] global      (mematikan Dimensi 12 LINEAGE AUDIT)
#
# PENGECUALIAN YANG TIDAK BISA DIMATIKAN: DIMENSI 2 (VOLUME). Ini BUKAN
# pilihan per-layer di YAML sama sekali -- check_volume() di dqcore/checks.py
# tidak punya syarat/flag apa pun, selalu jalan begitu profiles/*.json (hasil
# build_reference.py) ada. Mematikannya perlu mengubah kode engine (di luar
# lingkup permintaan ini), BUKAN sekadar menghapus sesuatu di file ini --
# jadi Data Docs akan TETAP menampilkan Dimensi 2 walau PDF tidak
# memintanya utk Silver. Sama halnya Dimensi 7 (DISTRIBUTION) TIDAK muncul
# bukan karena dimatikan sengaja, tapi karena memang butuh
# 'profil_distribusi: true' yang belum ada di kolom manapun di file ini.
#
# TEMUAN BERHARGA dari investigasi sebelum pencabutan ini -- disimpan di sini
# supaya tidak hilang kalau Dimensi 3/9/11/12 mau diaktifkan lagi nanti:
#   - silver_ars_transactions: kolom SQL Server PascalCase (RecordTime,
#     ETL_InsertedAt), kolom PARQUET snake_case (record_time). Kolom audit
#     BERGANTI NAMA DUA KALI di riwayatnya sendiri (dikonfirmasi user +
#     verifikasi S3 langsung, 2026-09-09): 2025-01-01 (hari pertama pipeline)
#     'loaded_at' -> 2025-01-08 s.d. 2026-09-07 (mayoritas riwayat, ~20 bulan)
#     'etl_inserted_at' -> 2026-09-08 dst (skema Glue TERKINI) 'loaded_at'
#     lagi. Kontrak 'kolom:'/'urutan_waktu' di blok dataset mengikuti skema
#     TERKINI ('loaded_at'); partisi historis di era 'etl_inserted_at' akan
#     gagal Dimensi 1/6 kalau divalidasi -- itu schema evolution asli, wajar.
#   - dqcore/spec.py TIDAK memvalidasi 'sumber.sql_server.kolom_waktu'
#     terhadap 'kolom:' lokal (sengaja, lihat komentar di spec.py) --
#     namespace SQL Server independen dari nama kolom parquet.
#   - SQL Server dbo.Silver_ARS_Transactions punya kolom 'SilverID' yang
#     TIDAK PERNAH ikut terekspor ke parquet -- kalau Dimensi 9 diaktifkan
#     lagi, ini akan selalu gagal sampai diklarifikasi ke pemilik pipeline
#     apakah itu memang disengaja.
#   - Partisi S3 dataset ini SELALU terdiri >1 file fisik per hari (writer
#     terdistribusi) -- dqcore/sources.py sudah diperbaiki 2026-09-08 utk
#     menggabungkan semuanya per tanggal, jadi ini TIDAK relevan lagi kalau
#     Dimensi 9/11 diaktifkan ulang, tapi dicatat sebagai konteks historis.
#
# ===========================================================================
# KONVENSI ANOTASI DI FILE INI -- supaya gampang maintain
# ===========================================================================
#
# Tiap key YAML yang MENGAKTIFKAN sebuah dimensi diberi komentar
# "# => DIMENSI N ..." tepat di baris yang sama/tepat di atasnya, di SETIAP
# blok dataset (bukan cuma dijelaskan sekali di header) -- supaya siapa pun
# yang buka satu blok dataset saja (tanpa scroll ke atas) langsung tahu
# dimensi mana yang jalan dari situ. Kalau menambah dataset baru, ikuti pola
# anotasi yang sama:
#
#   kunci:
#     waktu: <kolom>        # => DIMENSI 3 FRESHNESS
#     waktu_muat: <kolom>   # dipasangkan dgn 'waktu' utk hitung _lag_hari (DIMENSI 3)
#     bisnis: [<kolom>]     # => DIMENSI 5 UNIQUENESS
#
#   urutan_waktu:            # => DIMENSI 6 INTEGRITY (business logic consistency)
#     - [<kolom_lebih_baru>, <kolom_lebih_lama>]   # A >= B
#
#   sumber.sql_server.tabel  # => DIMENSI 9 REKONSILIASI SUMBER
#   ukuran_berkas.rentang    # => DIMENSI 11 COST & STORAGE SAFETY
#   kolom: [...].regex       # => DIMENSI 10 FORMAT & PATTERN COMPLIANCE (per kolom)
#
# Dimensi 1 (Schema), 4 (Missingness via 'wajib:' per kolom), dan
# 8 (Cleanliness/Encoding, otomatis utk semua kolom tipe: string) TIDAK diberi
# anotasi khusus di tiap baris kolom karena selalu aktif otomatis begitu
# 'kolom:' terisi -- menandainya di setiap baris cuma menambah noise.
#
# ${VAR} diganti otomatis dengan environment variable (dari .env), sama
# seperti datasets.yml/bronze_datasets.yml/bronze_data_validation.yml.
#
# CATATAN: file ini berisi nama tabel SQL Server, path S3, dan nama+tipe
# kolom asli organisasi -- SUDAH digitignore-kan, JANGAN di-git add manual.
# ===========================================================================

default:
  ambang:
    toleransi_volume: 0.15   # dipakai DIMENSI 2 VOLUME (otomatis begitu ada baseline; bukan pilihan sadar per layer)
    margin_null: 0.05        # dipakai DIMENSI 4 MISSINGNESS utk kolom wajib:false (proporsi terisi minimum)
  sla_lag_hari:              # TIDAK TERPAKAI saat ini -- dipakai DIMENSI 3 FRESHNESS, yang DIMATIKAN
                             # 2026-09-08 (lihat header). Dibiarkan di sini (bukan dihapus) supaya
                             # angkanya tidak perlu diturunkan ulang kalau dimensi ini diaktifkan lagi.
    harian: 2.0
    backfill: 260.0
  meta_audit:
    wajib: []   # => DIMENSI 12 LINEAGE AUDIT DIMATIKAN 2026-09-08 (lihat header) -- PDF tidak
                # memintanya utk Silver. Sebelumnya sempat [_ingested_at] (bug warisan bronze,
                # kolom itu tidak pernah ada di Silver), lalu [loaded_at] (ekstensi sadar), kini
                # dikosongkan total sesuai permintaan mempersempit ke 6 dimensi PDF persis.

datasets:

  # =========================================================================
  # SILVER ARS TRANSACTIONS -- hasil sp_ETL_LoadSilver_ARS_Transactions,
  # raw copy dbo.Silver_ARS_Transactions TANPA join/filter tambahan. Window
  # custom 07:00->07:00 hari berikutnya (SAMA dgn idempotency delete
  # sp_ETL_LoadSilver_ARS_Transactions Step 1), BUKAN kalender 00:00-24:00.
  # =========================================================================

  silver_ars_transactions:
    deskripsi: "Silver ARS Transactions -- raw copy dbo.Silver_ARS_Transactions, TANPA join/filter. Window custom 07:00->07:00 hari berikutnya (SAMA dgn idempotency delete sp_ETL_LoadSilver_ARS_Transactions Step 1), BUKAN kalender 00:00-24:00 biasa."

    sumber:
      s3: "s3://${S3_BUCKET_NAME}/datalake/silver/ars/ars_transactions/" #s3://kpn-gis-s3-bucket/datalake/silver/ars/ars_transactions/
      partisi: harian
      # 'sql_server:' (=> DIMENSI 9 REKONSILIASI SUMBER) DIHAPUS 2026-09-08 sesuai permintaan
      # mempersempit ke 6 dimensi PDF persis -- lihat catatan lengkap (termasuk nama kolom SQL
      # Server yang benar, RecordTime/ETL_InsertedAt PascalCase) di header REVISI 2026-09-08 (kedua).

    # Dimensi 11 STORAGE SAFETY DIMATIKAN 2026-09-08 ('ukuran_berkas.rentang' dihapus) -- lihat header.

    kunci:
      # 'waktu'/'waktu_muat' (=> DIMENSI 3 FRESHNESS) DIHAPUS 2026-09-08 -- lihat header.
      bisnis: [transaction_id]    # => DIMENSI 5 UNIQUENESS -- transaction_id kandidat paling jelas
                                   # sbg identitas unik per transaksi.

    # => DIMENSI 6 INTEGRITY (business logic consistency).
    # Aturan: data tidak mungkin di-load (loaded_at) sebelum ia direkam (record_time) --
    # analog persis dgn contoh PDF "ship_date >= order_date". PENTING -- kolom audit dataset
    # ini SUDAH GANTI NAMA DUA KALI (dikonfirmasi user + verifikasi S3 langsung, 2026-09-09):
    #   2025-01-01 (hari pertama pipeline)      : loaded_at
    #   2025-01-08 s.d. 2026-09-07 (mayoritas)   : etl_inserted_at
    #   2026-09-08 dst (skema Glue TERKINI)      : loaded_at (lagi)
    # YAML ini mengikuti skema TERKINI ('loaded_at') krn itu yang dipakai partisi yang akan terus
    # bertambah ke depan. Konsekuensinya: SEMUA partisi historis di era 'etl_inserted_at'
    # (2025-01-08 s.d. 2026-09-07 -- porsi TERBESAR riwayat) akan gagal Dimensi 1/6 kalau
    # divalidasi -- itu memang skema evolution asli yang harus tertangkap, bukan bug validator.
    urutan_waktu:
      - [loaded_at, record_time]

    # Dimensi 10 FORMAT & PATTERN COMPLIANCE: PDF minta regex standar bisnis (email, no. telepon,
    # dst) utk Silver, TAPI skema dataset ini (telemetri sensor plantation) tidak punya kolom
    # semacam itu -- tidak ada 'regex:' ditambahkan krn tidak ada standar format eksternal yang
    # applicable saat ini (bukan lupa/oversight). Kalau nanti ada kolom berformat tetap (mis. kode
    # device dgn pola digit tertentu), tambahkan 'regex:' di kolom itu.

    # Kolom NYATA hasil baca LANGSUNG partisi 2025-01-01 (671 baris, 2 file digabung) -- BUKAN
    # sampel 3 partisi scaffold.py 2026-09-01 lagi. 'wajib'/rentang/nilai-unik di bawah HANYA
    # mencerminkan HARI ITU SAJA (bahkan lebih sempit dari sampel 3-partisi biasa) -- kalau mau
    # cakupan lebih representatif, jalankan scaffold.py --glob/--s3 penuh lalu bandingkan lagi.
    # (Dimensi 1 SCHEMA, 4 MISSINGNESS via 'wajib:', dan 8 CLEANLINESS/ENCODING otomatis aktif dari daftar ini, lihat header.)
    kolom:
    - {nama: source,          tipe: string}   # 2 nilai unik, panjang 2-2
    - {nama: transaction_id,  tipe: string}   # 671 nilai unik, panjang 7-24
    - {nama: sensor_id,       tipe: string}   # 28 nilai unik, panjang 7-36
    - {nama: sensor_name,     tipe: string}   # 28 nilai unik, panjang 18-20
    - {nama: device_id,       tipe: string}   # 28 nilai unik, panjang 6-27
    - {nama: device_name,     tipe: string}   # 28 nilai unik, panjang 15-22
    - {nama: value,           tipe: float}   # rentang data 0..32.4
    - {nama: record_time,     tipe: datetime}   # waktu record
    - {nama: is_manual,       tipe: integer}   # rentang data 0..0 -- SEMUA 0 & tidak null di
      # partisi ini (beda dari sampel lama yg 100% null); tinjau ulang di partisi lain.
    - {nama: sensor_category, tipe: string}   # 1 nilai unik, panjang 8-8
    - {nama: jenis_device,    tipe: string}   # 1 nilai unik, panjang 8-8
    - {nama: sensor_unit,     tipe: string}   # 1 nilai unik, panjang 2-2
    - {nama: brand,           tipe: string}   # 3 nilai unik, panjang 9-12
    - {nama: connectivity,    tipe: string}   # 1 nilai unik, panjang 13-13
    - {nama: plantation,      tipe: string}   # 2 nilai unik, panjang 4-6
    - {nama: grouping,        tipe: string}   # 4 nilai unik, panjang 8-13
    - {nama: company_code,    tipe: string}   # 4 nilai unik, panjang 6-7
    - {nama: est_code,        tipe: string}   # 23 nilai unik, panjang 3-3
    - {nama: est_new_code,    tipe: string}   # 23 nilai unik, panjang 4-5
    - {nama: est_code_sap,    tipe: string}   # 23 nilai unik, panjang 4-4
    - {nama: block_gis,       tipe: string}   # 27 nilai unik, panjang 2-6
    - {nama: block_sap,       tipe: string}   # 27 nilai unik, panjang 2-6
    - {nama: loaded_at,       tipe: datetime}   # waktu load. Nama TERKINI (sejak partisi
      # 2026-09-08) -- sebelumnya sempat 'etl_inserted_at' selama ~20 bulan (2025-01-08 s.d.
      # 2026-09-07), lihat catatan skema evolution lengkap di 'urutan_waktu' & header di atas.

  # =========================================================================
  # SILVER AWL TRANSACTIONS -- hasil sp_ETL_LoadSilver_AWL_Transactions,
  # raw copy dbo.Silver_AWL_Transactions TANPA join/filter tambahan. Kalender
  # 00:00-24:00 BIASA -- TIDAK termasuk kelompok window custom 07:00->07:00
  # (window itu cuma berlaku utk data ARS & RS, DIKONFIRMASI user 2026-09-08).
  # =========================================================================

  silver_awl_transactions:
    deskripsi: "Silver AWL Transactions -- raw copy dbo.Silver_AWL_Transactions, TANPA join/filter. Partisi kalender 00:00-24:00 biasa."

    sumber:
      s3: "s3://${S3_BUCKET_NAME}/datalake/silver/awl/awl_transactions/" #s3://kpn-gis-s3-bucket/datalake/silver/awl/awl_transactions/
      partisi: harian
      # 'sql_server:' (=> DIMENSI 9 REKONSILIASI SUMBER) DIHAPUS 2026-09-08 -- lihat header.

    # Dimensi 11 STORAGE SAFETY DIMATIKAN 2026-09-08 ('ukuran_berkas.rentang' dihapus) -- lihat header.

    kunci:
      # 'waktu'/'waktu_muat' (=> DIMENSI 3 FRESHNESS) DIHAPUS 2026-09-08 -- lihat header.
      bisnis: [TransactionID]     # => DIMENSI 5 UNIQUENESS

    # => DIMENSI 6 INTEGRITY (business logic consistency). Aturan: loaded_at >= RecordTime.
    urutan_waktu:
      - [loaded_at, RecordTime]

    # Dimensi 10 FORMAT & PATTERN COMPLIANCE: sama seperti silver_ars_transactions -- tidak ada
    # standar format bisnis eksternal yang applicable pada skema ini saat ini, jadi 'regex:'
    # sengaja belum ditambahkan (bukan oversight).

    # Kolom NYATA hasil baca LANGSUNG partisi 2025-01-01 (3201 baris, 2 file digabung) -- BUKAN
    # sampel 3 partisi scaffold.py 2026-09-01 lagi. 'wajib'/rentang/nilai-unik di bawah HANYA
    # mencerminkan HARI ITU SAJA. PENTING: kolom 'ETL_InsertedAt' (ditemukan di partisi 2026-09-xx
    # lewat validate.py sebelumnya) TIDAK ADA sama sekali di partisi 2025-01-01 -- baru muncul di
    # skema belakangan, jadi SENGAJA tidak dimasukkan di sini (per permintaan "kolom yang ada di
    # S3 pada 2025-01-01"). Kalau mau validasi partisi terbaru, kolom itu perlu ditambahkan lagi.
    # (Dimensi 1 SCHEMA, 4 MISSINGNESS via 'wajib:', dan 8 CLEANLINESS/ENCODING otomatis aktif dari daftar ini, lihat header.)
    kolom:
      - {nama: Source,         tipe: string}   # 2 nilai unik, panjang 2-2
      - {nama: TransactionID,  tipe: string}   # 3201 nilai unik, panjang 7-24
      - {nama: SensorID,       tipe: string}   # 216 nilai unik, panjang 7-36
      - {nama: SensorName,     tipe: string}   # 28 nilai unik, panjang 12-30
      - {nama: DeviceID,       tipe: string}   # 71 nilai unik, panjang 6-16
      - {nama: DeviceName,     tipe: string}   # 71 nilai unik, panjang 21-27
      - {nama: Value,          tipe: float}   # rentang data -0.0556..1049.45
      - {nama: RecordTime,     tipe: datetime}   # waktu record
      - {nama: IsManual,       tipe: integer}   # rentang data 0..1, tidak null di partisi ini
        # (beda dari sampel lama yg 100% null); tinjau ulang di partisi lain.
      - {nama: Latitude,       tipe: string}   # 70 nilai unik, panjang 5-19
      - {nama: Longitude,      tipe: string}   # 70 nilai unik, panjang 8-18
      - {nama: SensorCategory, tipe: string}   # 6 nilai unik, panjang 6-14
      - {nama: JenisDevice,    tipe: string}   # 4 nilai unik, panjang 4-7
      - {nama: SensorUnit,     tipe: string}   # 6 nilai unik, panjang 1-3
      - {nama: Brand,          tipe: string}   # 2 nilai unik, panjang 11-12
      - {nama: Connectivity,   tipe: string}   # 1 nilai unik, panjang 13-13
      - {nama: Plantation,     tipe: string}   # 3 nilai unik, panjang 4-8
      - {nama: Grouping,       tipe: string}   # 6 nilai unik, panjang 8-17
      - {nama: CompanyCode,    tipe: string}   # 6 nilai unik, panjang 6-7
      - {nama: EstCode,        tipe: string}   # 27 nilai unik, panjang 3-4
      - {nama: EstNewCode,     tipe: string}   # 27 nilai unik, panjang 4-5
      - {nama: EstCodeSAP,     tipe: string}   # 27 nilai unik, panjang 4-4
      - {nama: BlockGIS,       tipe: string}   # 67 nilai unik, panjang 2-8
      - {nama: BlockSAP,       tipe: string}   # 63 nilai unik, panjang 0-8 (ADA STRING KOSONG --
        # panjang minimum 0, akan tertangkap Dimensi 4/8 sbg "string kosong tersembunyi")
      - {nama: loaded_at,      tipe: datetime}   # waktu load

  # =========================================================================
  # SILVER PZO TMAT MEASUREMENT -- pembacaan manual TMAT (Tinggi Muka Air
  # Tanah) piezometer, digabung dgn hierarki master (plantation/estate/
  # device/indicator) & pengelompokan mingguan (WeekID/WeekStartDate/
  # WeekEndDate). Partisi KALENDER HARIAN (recorded_year=/month=/day=),
  # BUKAN mingguan seperti disebut jobs.py Fase 1 utk job Gold "tmat" lama
  # (yang sudah dinonaktifkan/di-comment di sana) -- pipeline Silver ini
  # tampaknya sudah dimigrasi ke pola partisi harian standar.
  # =========================================================================

  silver_pzo_tmat_measurement:
    deskripsi: "Silver PZO TMAT Measurement -- pembacaan manual tinggi muka air piezometer per minggu, digabung dgn master plantation/estate/device/indicator."

    sumber:
      s3: "s3://${S3_BUCKET_NAME}/datalake/silver/pzo/tmat_measurement/" #s3://kpn-gis-s3-bucket/datalake/silver/pzo/tmat_measurement/
      partisi: harian
      # 'sql_server:' (=> DIMENSI 9 REKONSILIASI SUMBER) TIDAK ditambahkan -- konsisten dgn
      # keputusan file ini yg dipersempit ke 6 dimensi PDF persis (lihat header atas).

    # Dimensi 11 STORAGE SAFETY TIDAK diaktifkan -- konsisten dgn keputusan file ini (lihat header).

    kunci:
      # 'waktu'/'waktu_muat' (=> DIMENSI 3 FRESHNESS) TIDAK diaktifkan -- konsisten dgn header.
      surrogate: MeasurementID    # DIVERIFIKASI 100% unik di seluruh 19 partisi (7514 baris)
      bisnis: [PieRecordID, WeekID]   # => DIMENSI 5 UNIQUENESS -- DIVERIFIKASI 100% unik (0
                                       # duplikat) di seluruh 19 partisi. PieRecordID SENDIRIAN
                                       # TIDAK unik (cuma 2213 nilai unik dari 7514 baris -- satu
                                       # piezometer wajar punya banyak baris lintas minggu) --
                                       # scaffold.py sempat salah menebaknya sbg kunci.surrogate
                                       # krn sampel 10 partisi kebetulan tidak menangkap piezometer
                                       # yang sama di 2 minggu berbeda. Klasik kasus "wajib/unik
                                       # dihitung dari sampel, bukan jaminan penuh riwayat".

    # => DIMENSI 6 INTEGRITY (business logic consistency) -- DIVERIFIKASI 100% (bukan cuma
    # sampel scaffold) thd seluruh 19 partisi: MeasurementDate SELALU berada di antara
    # WeekStartDate & WeekEndDate.
    urutan_waktu:
      - [WeekEndDate, MeasurementDate]
      - [MeasurementDate, WeekStartDate]

    # => DIMENSI 6 INTEGRITY (referential 1:1) -- SEMUA DIVERIFIKASI 100% konsisten thd
    # seluruh 19 partisi (bukan cuma sampel scaffold 10 partisi).
    #
    # [DeviceIOTID, DeviceIOTName] SENGAJA TIDAK dimasukkan walau 100% konsisten (diverifikasi
    # manual) -- ExpectColumnPairValuesToBeInSet CRASH internal (pandas.errors.IndexingError:
    # "Unalignable boolean Series provided as indexer") saat dijalankan thd pasangan kolom ini,
    # dikonfirmasi 2026-09-09 dgn menjalankan expectation-nya langsung di luar Runner.check().
    # Kemungkinan besar dipicu null rate SANGAT tinggi (97%) di kedua kolom -- pasangan relasi
    # lain di bawah ini (0% null) tidak kena. Runner.check() saat ini MENELAN exception itu diam-
    # diam (GX menangkapnya sendiri, res.success=False, res.result={} -- tidak ada Python
    # exception yg lolos ke try/except kita), sehingga MUNCUL seperti kegagalan data biasa
    # ("Observasi: None") padahal sebenarnya check-nya tidak pernah benar-benar jalan. Kalau
    # nanti field GX/pandas memperbaiki bug ini, boleh dicoba diaktifkan lagi.
    relasi:
      - [EstCode, EstNewCode]
      - [EstCode, EstCodeSAP]
      - [EstNewCode, EstCodeSAP]
      - [IndicatorName, IndicatorAlias]
      - [IndicatorName, IndicatorAliasReport]
      - [IndicatorAlias, IndicatorAliasReport]

    # Dimensi 10 FORMAT & PATTERN COMPLIANCE: sama seperti dataset lain di file ini -- tidak ada
    # standar format bisnis eksternal yang applicable saat ini, jadi 'regex:' belum ditambahkan.

    # Kolom NYATA hasil baca LANGSUNG seluruh 19 partisi S3 sungguhan (2026-09-09, 7514 baris
    # gabungan) -- BUKAN sampel scaffold.py 10 partisi (yang salah menyimpulkan PieRecordID unik
    # & tidak menangkap kolom ETL_InsertedAt sama sekali). 'wajib' & statistik di bawah dihitung
    # dari histori PENUH yang tersedia saat ini.
    #
    # SCHEMA EVOLUTION (pola SAMA PERSIS dgn silver_ars_transactions, DIVERIFIKASI 2026-09-09):
    # kolom audit berganti nama 2x: 2025-01-01 (hari pertama pipeline) 'loaded_at' ->
    # 2026-08-13 s.d. 2026-09-04 (mayoritas riwayat, 16/19 partisi) 'ETL_InsertedAt' ->
    # 2026-09-07 dst (skema TERKINI, 2/19 partisi sejauh ini) 'loaded_at' lagi. YAML ini
    # mengikuti skema TERKINI ('loaded_at') -- partisi era 'ETL_InsertedAt' akan gagal
    # Dimensi 1 kalau divalidasi, itu schema evolution asli yang harus tertangkap, wajar.
    # (Dimensi 1 SCHEMA, 4 MISSINGNESS via 'wajib:', dan 8 CLEANLINESS/ENCODING otomatis aktif dari daftar ini, lihat header.)
    kolom:
      - {nama: SourceSystem,              tipe: string}   # 1 nilai unik, panjang 12-12
      - {nama: PieRecordID,               tipe: string}   # 2213 nilai unik, panjang 6-7 (BUKAN unik per baris -- lihat kunci.bisnis)
      - {nama: Plantation,                tipe: string}   # 4 nilai unik, panjang 4-8
      - {nama: GroupingName,              tipe: string}   # 7 nilai unik, panjang 8-17
      - {nama: CompanyCode,               tipe: string}   # 15 nilai unik, panjang 6-8
      - {nama: EstCode,                   tipe: string}   # 42 nilai unik, panjang 3-4
      - {nama: EstNewCode,                tipe: string}   # 42 nilai unik, panjang 3-5
      - {nama: EstCodeSAP,                tipe: string}   # 42 nilai unik, panjang 4-4
      - {nama: Division,                  tipe: string, wajib: false}   # null 1.6%; 6 nilai unik, panjang 5-5
      - {nama: BlockMapping,              tipe: string}   # 2083 nilai unik, panjang 1-32
      - {nama: PiezoTypeID,               tipe: integer}   # rentang data 1..2
      - {nama: PiezoTypeLabel,            tipe: string}   # 2 nilai unik, panjang 6-6
      - {nama: PiezoClassID,              tipe: integer}   # rentang data 1..3
      - {nama: PiezoClassLabel,           tipe: string}   # 3 nilai unik, panjang 6-12
      - {nama: Latitude,                  tipe: decimal}   # rentang data -2.83181..109.312
      - {nama: Longitude,                 tipe: decimal}   # rentang data -0.2115..119.337
      - {nama: JarakMeter,                tipe: decimal, wajib: false}   # null 81.0%; rentang data 0.31..4590.15
      - {nama: DeviceIOTID,               tipe: string, wajib: false}   # null 97.1%; 60 nilai unik, panjang 3-9
      - {nama: DeviceIOTName,             tipe: string, wajib: false}   # null 97.1%; 60 nilai unik, panjang 22-26
      - {nama: Jenis,                     tipe: string}   # 4 nilai unik, panjang 12-14
      - {nama: Status,                    tipe: string}   # 2 nilai unik, panjang 5-9
      - {nama: WeekID,                    tipe: integer}   # rentang data 435..523
      - {nama: WeekName,                  tipe: string}   # 6 nilai unik, panjang 7-7 -- 'referensi:
        # true' SENGAJA TIDAK dipakai: satu partisi harian pasti cuma berisi 1 nilai WeekName
        # (satu hari = satu minggu), jadi check "distinct value = 6 nilai master" (Dimensi 7,
        # auto-aktif utk referensi: true berkardinalitas <=10 -- lihat checks.py check_distribution())
        # PASTI selalu warning terlepas datanya benar atau tidak -- bukan sinyal berguna utk kolom ini.
      - {nama: WeekYear,                  tipe: integer}   # rentang data 2025..2026
      - {nama: WeekMonth,                 tipe: integer}   # rentang data 1..9
      - {nama: WeekOfMonth,               tipe: integer}   # rentang data 1..4
      - {nama: WeekStartDate,             tipe: datetime}
      - {nama: WeekEndDate,               tipe: datetime}
      - {nama: MeasurementID,             tipe: integer}   # 7514 nilai unik -- => kunci.surrogate
      - {nama: Ketinggian,                tipe: decimal}   # rentang data 4..255
      - {nama: Unit,                      tipe: string}   # 1 nilai unik, panjang 2-2
      - {nama: Kondisi,                   tipe: string}   # 2 nilai unik, panjang 4-15
      - {nama: MeasurementDate,           tipe: datetime}
      - {nama: MeasurementDateOnly,       tipe: datetime}   # DIPERBAIKI 2026-09-09: sebelumnya
        # tertulis 'string' (tebakan scaffold.py salah -- dtype pandas 'object' selalu diklaim
        # 'string' oleh tipe_logis(), padahal isinya objek datetime.date asli, dikonfirmasi baca
        # langsung beberapa partisi). BUKAN kode referensi (nilai baru selalu wajar muncul seiring
        # waktu), jadi SENGAJA tidak diberi referensi: true walau scaffold.py menyarankannya.
      - {nama: IndicatorID,               tipe: integer}   # rentang data 2..6
      - {nama: IndicatorName,             tipe: string}   # 5 nilai unik, panjang 3-5
      - {nama: IndicatorAlias,            tipe: string}   # 5 nilai unik, panjang 11-44
      - {nama: IndicatorAliasReport,      tipe: string}   # 5 nilai unik, panjang 6-14
      - {nama: IndicatorMinValue,         tipe: integer}   # rentang data 0..66
      - {nama: IndicatorMaxValue,         tipe: integer}   # rentang data 40..998
      - {nama: IndicatorStandardLoadedAt, tipe: datetime}
      - {nama: UserID,                    tipe: integer}   # rentang data 1362..37063
      - {nama: NamaUser,                  tipe: string}   # 104 nilai unik, panjang 4-25
