  # =========================================================================
  # SILVER RS TRANSACTIONS -- data curah hujan manual (Rainfall Sensor),
  # per stasiun per periode, digabung dgn hierarki master (plantation/
  # estate/lokasi). DIKONFIRMASI user (2026-09-08): dataset inilah, bersama
  # ARS, yang termasuk kelompok window custom 07:00->07:00 (bukan AWL).
  # Partisi kalender HARIAN, 1 file/hari (BEDA dari ARS/AWL yang 2 file/hari).
  # =========================================================================

  silver_rs_transactions:
    deskripsi: "Silver RS Transactions -- data curah hujan manual per stasiun per periode, digabung dgn master plantation/estate/lokasi."

    sumber:
      s3: "s3://${S3_BUCKET_NAME}/datalake/silver/rs/rs_transactions/" #s3://kpn-gis-s3-bucket/datalake/silver/rs/rs_transactions/
      partisi: harian
      # 'sql_server:' (=> DIMENSI 9 REKONSILIASI SUMBER) TIDAK ditambahkan -- konsisten dgn
      # keputusan file ini yg dipersempit ke 6 dimensi PDF persis (lihat header atas).

    # Dimensi 11 STORAGE SAFETY TIDAK diaktifkan -- konsisten dgn keputusan file ini (lihat header).

    kunci:
      # 'waktu'/'waktu_muat' (=> DIMENSI 3 FRESHNESS) TIDAK diaktifkan -- konsisten dgn header.
      surrogate: silver_id   # => DIMENSI 5 UNIQUENESS -- DIVERIFIKASI 100% unik (824/824 baris,
                              # 13 partisi). TIDAK ADA 'kunci.bisnis' komposit ditambahkan --
                              # [station_id, period_date] TERNYATA BUKAN unik (cuma 638/824 unik,
                              # 186 duplikat -- satu stasiun bisa lapor >1x utk periode yang sama).
                              # kunci.surrogate sendirian sudah cukup mengaktifkan Dimensi 5.

    # => DIMENSI 6 INTEGRITY (business logic consistency) -- DIVERIFIKASI 100% (bukan cuma
    # sampel scaffold) thd seluruh 13 partisi, TAPI HANYA utk baris yg keduanya terisi (625/824
    # baris -- sisanya null krn join opsional, lihat 'wajib: false' di kolom.start_date/end_date
    # di bawah). 'period_date berada di antara start_date & end_date' SENGAJA TIDAK ditambahkan
    # walau berkorelasi tinggi (98.08%) -- BUKAN 100%, beda dgn urutan_waktu di bawah yg memang
    # 100% valid; memaksakan aturan yg cuma 98% benar sbg expectation blocking akan menghasilkan
    # kegagalan berulang utk kasus yang sah.
    urutan_waktu:
      - [end_date, start_date]

    # => DIMENSI 6 INTEGRITY (referential 1:1) -- SEMUA DIVERIFIKASI 100% konsisten thd seluruh
    # 13 partisi.
    #
    # [est_new_code, est_code_sap] SENGAJA TIDAK dimasukkan walau 100% konsisten (diverifikasi
    # manual) -- ExpectColumnPairValuesToBeInSet CRASH internal yang SAMA PERSIS dgn temuan di
    # silver_pzo_tmat_measurement (pandas.errors.IndexingError: "Unalignable boolean Series
    # provided as indexer"), dikonfirmasi 2026-09-09 dgn menjalankan expectation-nya langsung.
    # Kolom station_id/station_id_sap/station_sap AMAN (0% null, tidak kena bug ini) --
    # est_new_code/est_code_sap punya 24.2% null, cukup utk memicu bug yang sama.
    relasi:
      - [station_id, station_id_sap]
      - [station_id, station_sap]
      - [station_id_sap, station_sap]

    # => DIMENSI 6 INTEGRITY (flag boolean konsisten dgn kondisi kolom lain) -- DIVERIFIKASI 100%
    # thd seluruh 13 partisi: rain_day_flag=False SELALU berpasangan dgn rainfall_mm=0 persis,
    # rain_day_flag=True SELALU berpasangan dgn rainfall_mm>0 (1.00..53.00). 'rentang' di kolom
    # rainfall_mm di bawah HANYA dipakai utk pengecekan ini (ambang bawah 0.01 memisahkan "ada
    # hujan" dari "0 mm tepat") -- TIDAK mengaktifkan Dimensi 7 DISTRIBUTION krn 'profil_distribusi'
    # tidak diset (lihat dqcore/checks.py: 'rentang' cuma dipakai Dimensi 7 lewat kolom_profil,
    # yang disaring dari 'profil_distribusi: true', bukan dari 'rentang' semata).
    flag_dq:
      - {flag: rain_day_flag, kolom: rainfall_mm, aturan: ada_dan_dalam_rentang}

    # Dimensi 10 FORMAT & PATTERN COMPLIANCE: sama seperti dataset lain di file ini -- tidak ada
    # standar format bisnis eksternal yang applicable saat ini, jadi 'regex:' belum ditambahkan.

    # Kolom NYATA hasil baca LANGSUNG seluruh 13 partisi S3 sungguhan (2026-09-09, 824 baris
    # gabungan) -- BUKAN sampel scaffold.py 10 partisi. 'wajib' & statistik dihitung dari histori
    # PENUH yang tersedia saat ini. Kolom start_date/end_date/status/create_by/created_name/
    # create_date/est_new_code/est_code_sap/location SEMUA null di baris yang SAMA (24.2%) --
    # kemungkinan satu join master opsional yang gagal utk sebagian station_id, bukan 9 masalah
    # independen. create_by/created_name/create_date HANYA punya SATU nilai non-null di seluruh
    # riwayat (17601 / "Yogi Sugara" / 2024-12-31) -- terlihat seperti metadata "siapa yang
    # membuat master" (statis), BUKAN timestamp/aktor per-baris yang genuinely bervariasi --
    # SENGAJA TIDAK dipakai sbg kunci.waktu/waktu_muat walau namanya 'create_date'.
    #
    # SCHEMA EVOLUTION (pola SAMA PERSIS dgn silver_ars_transactions/silver_pzo_tmat_measurement):
    # kolom audit berganti nama 2x: 2025-01-01 (hari pertama pipeline) 'loaded_at' ->
    # 2026-08-26 s.d. 2026-09-07 (mayoritas riwayat, 11/13 partisi) 'etl_inserted_at' ->
    # 2026-09-08 (skema TERKINI) 'loaded_at' lagi. YAML ini mengikuti skema TERKINI.
    # (Dimensi 1 SCHEMA, 4 MISSINGNESS via 'wajib:', dan 8 CLEANLINESS/ENCODING otomatis aktif dari daftar ini, lihat header.)
    kolom:
      - {nama: silver_id,      tipe: integer}   # 824 nilai unik -- => kunci.surrogate
      - {nama: station_id,     tipe: string}   # 58 nilai unik, panjang 1-2
      - {nama: station_id_sap, tipe: string}   # 58 nilai unik, panjang 0-16
      - {nama: station_sap,    tipe: string}   # 58 nilai unik, panjang 0-10
      - {nama: start_date,     tipe: datetime, wajib: false}   # null 24.2%
      - {nama: end_date,       tipe: datetime, wajib: false}   # null 24.2%
      - {nama: status,         tipe: string, wajib: false}   # null 24.2%; 2 nilai
        # unik -- referensi:true DI SINI MEMICU DIMENSI 7 (distinct-set, cardinality 2-10) --
        # SAMA PERSIS isu terbuka yg dibahas utk silver_pzo_tmat_measurement, belum diputuskan.
      - {nama: create_by,      tipe: float, wajib: false}   # null 24.2%; SATU nilai non-null
        # (17601) di seluruh riwayat -- lihat catatan di atas.
      - {nama: created_name,   tipe: string, wajib: false}   # null 24.2%; 1 nilai
        # unik (aman dari Dimensi 7 -- butuh >1 nilai utk terpicu)
      - {nama: create_date,    tipe: datetime, wajib: false}   # null 24.2%; SATU nilai non-null
        # di seluruh riwayat -- lihat catatan di atas, BUKAN kolom waktu kejadian asli.
      - {nama: plantation,     tipe: string}   # 5 nilai unik -- MEMICU DIMENSI 7
        # (sama isu terbuka spt 'status' di atas).
      - {nama: grouping,       tipe: string}   # 9 nilai unik -- MEMICU DIMENSI 7.
      - {nama: company_code,   tipe: string}   # 24 nilai unik
      - {nama: est_code,       tipe: string}   # 54 nilai unik
      - {nama: est_new_code,   tipe: string, wajib: false}   # null 24.2%; 53 nilai unik
      - {nama: est_code_sap,   tipe: string, wajib: false}   # null 24.2%; 53 nilai unik
      - {nama: location,       tipe: string, wajib: false}   # null 24.2%; 5 nilai
        # unik -- MEMICU DIMENSI 7 (sama isu terbuka spt 'status' di atas).
      - {nama: period_date,    tipe: datetime}   # 13 nilai unik -- waktu kejadian ASLI (BUKAN
        # create_date, lihat catatan di atas), tapi Dimensi 3 FRESHNESS tetap dimatikan sesuai
        # kebijakan file ini.
      - {nama: rain_day_flag,  tipe: boolean}   # => DIMENSI 6 (flag_dq, lihat di atas)
      - {nama: rainfall_mm,    tipe: decimal, rentang: [0.01, 1000]}   # rentang data asli 0..53;
        # 'rentang' di sini HANYA dipakai flag_dq (lihat catatan flag_dq di atas), BUKAN utk
        # Dimensi 7 (profil_distribusi tidak diset).
      - {nama: loaded_at,      tipe: datetime}   # waktu load. Nama TERKINI (sejak partisi
        # 2026-09-08) -- sebelumnya sempat 'etl_inserted_at' (2026-08-26 s.d. 2026-09-07,
        # mayoritas riwayat). Pola skema evolution sama dgn dataset lain di file ini.


