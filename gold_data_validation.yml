      partisi: harian

      # DIMENSI 9 — REKONSILIASI SUMBER
      # Belum diaktifkan sampai logic rekonsiliasi dikonfirmasi.
      # sql_server:
      #   tabel: "dbo.Gold_RS_Readings"
      #   kolom_waktu: period_date
      #   offset_jam: 0

    kunci:
