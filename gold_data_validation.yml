  gold_data_tmat:
    deskripsi: "Gold Data TMAT - Data ketinggian air tanah (TMAT) dari berbagai sumber. Data dipartisi secara mingguan."

    sumber:
      s3: "s3://${S3_BUCKET_NAME}/datalake/gold/pzo/data_tmat/"
      partisi: mingguan

      sql_server:
        tabel: "dbo.Gold_Data_TMAT"
        kolom_waktu: recorded_date
        offset_jam: 7

    # DIMENSI 11: Storage Safety
    ukuran_berkas:
      rentang: [1000, 5000000000]

    # DIMENSI 3: Freshness, DIMENSI 5: Uniqueness
    kunci:
      waktu: recorded_date
      waktu_muat: loaded_at 
      surrogate: point_id

    # DIMENSI 1: Schema, DIMENSI 4: Missingness, DIMENSI 6: Integrity, DIMENSI 7: Distribution
    kolom:
      # --- Identitas Utama ---
      - {nama: point_id, tipe: string, deskripsi: "ID unik titik pengukuran", profil_distribusi: true}
      - {nama: week_id, tipe: integer, wajib: false, deskripsi: "ID minggu pengukuran", profil_distribusi: true}

      # --- DIMENSI 6: Integrity (Referensi ke master estate) ---
      - {nama: plantation, tipe: string, wajib: false, deskripsi: "Nama plantation/kebun"}
      - {nama: grouping, tipe: string, wajib: false, deskripsi: "Grouping/klaster kebun"}
      - {nama: company_code, tipe: string, wajib: false, referensi: true, relasi: 'bronze_estate_mapping.CompanyCode', sumber: 'bronze_estate_mapping', deskripsi: "Kode perusahaan - referensi ke master mapping", profil_distribusi: true}
      - {nama: est_code, tipe: string, wajib: false, referensi: true, relasi: 'bronze_estate_mapping.EstCode', sumber: 'bronze_estate_mapping', deskripsi: "Kode estate - referensi ke master mapping", profil_distribusi: true}
      - {nama: est_new_code, tipe: string, wajib: false, referensi: true, relasi: 'bronze_estate_mapping.EstNewCode', sumber: 'bronze_estate_mapping', deskripsi: "Kode estate baru - referensi ke master mapping", profil_distribusi: true}
      - {nama: est_code_sap, tipe: string, wajib: false, referensi: true, relasi: 'bronze_estate_mapping.EstCodeSAP', sumber: 'bronze_estate_mapping', deskripsi: "Kode estate SAP - referensi ke master mapping", profil_distribusi: true}

      # --- Informasi Blok ---
      - {nama: block_gis, tipe: string, wajib: false, deskripsi: "Kode blok dari GIS"}
      - {nama: block_sap, tipe: string, wajib: false, deskripsi: "Kode blok dari SAP"}

      # --- Informasi Piezo ---
      - {nama: piezo_type_id, tipe: integer, wajib: false, deskripsi: "ID tipe piezo", profil_distribusi: true}
      - {nama: piezo_class_id, tipe: integer, wajib: false, deskripsi: "ID kelas piezo", profil_distribusi: true}

      # --- Lokasi Geografis ---
      - {nama: point_latitude, tipe: decimal, wajib: false, deskripsi: "Koordinat lintang titik pengukuran"}
      - {nama: point_longitude, tipe: decimal, wajib: false, deskripsi: "Koordinat bujur titik pengukuran"}

      # --- Data Pengukuran ---
      - {nama: recorded_date, tipe: datetime, deskripsi: "Tanggal recording data", profil_distribusi: true}
      - {nama: ketinggian, tipe: decimal, wajib: false, deskripsi: "Nilai ketinggian air tanah (meter)"}
      - {nama: unit, tipe: string, wajib: false, deskripsi: "Unit pengukuran ketinggian", profil_distribusi: true}
      - {nama: kondisi, tipe: string, wajib: false, deskripsi: "Kondisi pengukuran", profil_distribusi: true}

      # --- Informasi Indikator ---
      - {nama: indicator_id, tipe: integer, wajib: false, deskripsi: "ID indikator", profil_distribusi: true}
      - {nama: indicator_name, tipe: string, wajib: false, deskripsi: "Nama indikator", profil_distribusi: true}
      - {nama: indicator_alias, tipe: string, wajib: false, deskripsi: "Alias indikator", profil_distribusi: true}

      # --- Dimensi Waktu ---
      - {nama: recorded_month, tipe: string, wajib: false, deskripsi: "Bulan recording"}
      - {nama: recorded_week, tipe: string, wajib: false, deskripsi: "Minggu recording"}
      - {nama: recorded_year, tipe: integer, wajib: false, deskripsi: "Tahun recording"}

      # --- DIMENSI 12: Lineage & Auditability ---
      - {nama: loaded_at, tipe: datetime, deskripsi: "Timestamp saat data dimuat ke gold layer"}
      - {nama: snapshot_date, tipe: datetime, wajib: false, deskripsi: "Tanggal snapshot data"}

    # DIMENSI 6: Integrity (Aturan Konsistensi)
    sama_nilai:
      - [est_code, est_new_code]
      - [block_gis, block_sap]

    # DIMENSI 6: Integrity (Aturan Urutan Waktu)
    urutan_waktu:
      - [recorded_date, loaded_at]

    # DIMENSI 7: Distribution
    distribusi:
      - kolom: company_code
        tipe: "categorical"
      - kolom: est_code
        tipe: "categorical"
      - kolom: est_new_code 
        tipe: "categorical"
      - kolom: est_code_sap
        tipe: "categorical"
      - kolom: piezo_type_id
        tipe: "categorical"
      - kolom: piezo_class_id
        tipe: "categorical"
      - kolom: unit
        tipe: "categorical"
        expected_values: ["m", "cm", "mm"]
      - kolom: kondisi
        tipe: "categorical"
        expected_values: ["Normal", "Kering", "Banjir", "Maintenance"]
      - kolom: indicator_id
        tipe: "categorical"
      - kolom: indicator_name
        tipe: "categorical"
      - kolom: indicator_alias
        tipe: "categorical"
  



  # =========================================================================
  # GOLD MASTER TMAT — SQL SERVER AS SOURCE OF TRUTH
  # =========================================================================

  gold_master_tmat:
    deskripsi: "Gold Master TMAT -- validasi schema dan kualitas data Parquet berdasarkan dbo.Gold_Master_TMAT di SQL Server."

    sumber:
      s3: "s3://${S3_BUCKET_NAME}/datalake/gold/pzo/master_tmat/"
      partisi: snapshot

      # DIMENSI 9 — REKONSILIASI SUMBER
      # Konfigurasi SQL perlu disesuaikan dengan logic rekonsiliasi.
      # sql_server:
      #   tabel: "dbo.Gold_Master_TMAT"
      #   kolom_waktu: loaded_at
      #   offset_jam: 7

    kunci:
      surrogate: pie_record_id

    kolom:
      - {nama: gold_id,           tipe: integer}
      - {nama: pie_record_id,     tipe: string}
      - {nama: piezo_type_id,     tipe: integer, wajib: false}
      - {nama: piezo_type_label,  tipe: string, wajib: false}
      - {nama: piezo_class_id,    tipe: integer, wajib: false}
      - {nama: piezo_class_label, tipe: string, wajib: false}
      - {nama: device_name_iot,   tipe: string}
      - {nama: plantation,        tipe: string, wajib: false}
      - {nama: grouping_name,     tipe: string, wajib: false}
      - {nama: company_code,      tipe: string, wajib: false}
      - {nama: est_code,          tipe: string}
      - {nama: est_new_code,      tipe: string, wajib: false}
      - {nama: est_code_sap,      tipe: string, wajib: false}
      - {nama: division,          tipe: string, wajib: false}
      - {nama: block_mapping,     tipe: string}
      - {nama: unit_pemantauan,   tipe: string}
      - {nama: image_location_url, tipe: string, wajib: false}
      - {nama: latitude,          tipe: decimal}
      - {nama: longitude,         tipe: decimal}
      - {nama: jarak_meter,       tipe: decimal, wajib: false, profil_distribusi: true, satuan: "meter"}
      - {nama: jenis,             tipe: string}
      - {nama: status,            tipe: string}
      - {nama: user_id_editor,    tipe: integer, wajib: false}
      - {nama: nama_user_edit,    tipe: string, wajib: false}
      - {nama: registered_date,   tipe: datetime}
      - {nama: last_update,       tipe: datetime}
      - {nama: is_klhk,           tipe: boolean}
      - {nama: loaded_at,         tipe: datetime}


    relasi:
      - [est_new_code, est_code_sap]

    urutan_waktu:
      - [last_update, registered_date]



  # =========================================================================
  # GOLD DATA TMAS — SQL SERVER AS SOURCE OF TRUTH
  # =========================================================================

  gold_data_tmas:
    deskripsi: "Gold Data TMAS -- validasi schema dan kualitas data Parquet berdasarkan dbo.Gold_WL_TMAS_Readings di SQL Server."

    sumber:
      s3: "s3://kpn-gis-s3-bucket/datalake/gold/wlr/data_tmas/"
      partisi: harian

      # DIMENSI 9 — REKONSILIASI SUMBER
      # Belum diaktifkan sampai filter tanggal dan logic rekonsiliasi dikonfirmasi.
      # sql_server:
      #   tabel: "dbo.Gold_WL_TMAS_Readings"
      #   kolom_waktu: measurement_date
      #   offset_jam: 0

    # DIMENSI 5 — UNIQUENESS
    kunci:
      surrogate: measurement_id
      waktu: measurement_date

    # DIMENSI 6 — INTEGRITY
    # Aktifkan setelah diverifikasi dengan SQL.
    # urutan_waktu:
    #   - [input_date, measurement_date]

    kolom:
      - {nama: gold_id,                 tipe: integer}
      - {nama: measurement_id,          tipe: integer}
      - {nama: station_id,              tipe: string}
      - {nama: station_name,            tipe: string}
      - {nama: station_type_id,         tipe: integer}
      - {nama: station_type_label,      tipe: string}
      - {nama: zona_id,                 tipe: string, wajib: false}
      - {nama: zona_name,               tipe: string, wajib: false}
      - {nama: plantation,              tipe: string}
      - {nama: grouping_name,           tipe: string}
      - {nama: company_code,            tipe: string}
      - {nama: est_code,                tipe: string}
      - {nama: est_new_code,            tipe: string, wajib: false}
      - {nama: est_code_sap,            tipe: string, wajib: false}
      - {nama: latitude,                tipe: decimal, wajib: false}
      - {nama: longitude,               tipe: decimal, wajib: false}
      - {nama: accuracy,                tipe: decimal, wajib: false}
      - {nama: elevasi_tanah,           tipe: decimal, wajib: false}
      - {nama: frequency,               tipe: integer, wajib: false}
      - {nama: status,                  tipe: string}
      - {nama: measurement_date,        tipe: datetime}
      - {nama: measurement_date_only,   tipe: datetime}
      - {nama: input_date,              tipe: datetime, wajib: false}
      - {nama: station_registered_date, tipe: datetime, wajib: false}
      - {nama: ketinggian, tipe: decimal, wajib: false, profil_distribusi: true}
      - {nama: unit,                    tipe: string}
      - {nama: target_wl_history_id, tipe: integer, wajib: false}
      - {nama: target_wl, tipe: decimal, wajib: false, profil_distribusi: true}
      - {nama: has_target,              tipe: boolean}
      - {nama: water_level_gap, tipe: decimal, wajib: false, profil_distribusi: true}
      - {nama: is_below_target,         tipe: boolean}
      - {nama: user_id,                 tipe: integer, wajib: false}
      - {nama: nama_user,               tipe: string, wajib: false}
      - {nama: loaded_at,               tipe: datetime}


    # DIMENSI 6 — INTEGRITY
      # SQL SERVER VERIFIED:
      #
      # 1. measurement_date_only = DATE(measurement_date)
      # 2. has_target = 0 -> target_wl IS NULL
      # 3. has_target = 1 -> target_wl IS NOT NULL
      # 4. ketinggian IS NULL -> water_level_gap IS NULL
      #    (for records with a target)
    urutan_waktu:
      - [loaded_at, measurement_date]

   



  # =========================================================================
