      - {nama: est_new_code, tipe: string, wajib: false, referensi: true, relasi: 'bronze_estate_mapping.EstNewCode', sumber: 'bronze_estate_mapping', deskripsi: "Kode estate baru - referensi ke master mapping",profil_distribusi: true}
      - {nama: est_code_sap, tipe: string, wajib: false, referensi: true, relasi: 'bronze_estate_mapping.EstCodeSAP', sumber: 'bronze_estate_mapping', deskripsi: "Kode estate SAP - referensi ke master mapping",profil_distribusi: true}

