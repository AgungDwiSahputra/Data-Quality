      # DIMENSI 7 — DISTRIBUTION

      - {nama: rain_day_flag,           tipe: boolean}
      - {nama: rain_category,           tipe: string}

      # DIMENSI 7 — DISTRIBUTION
      - {nama: rainfall_mm,     tipe: decimal, wajib: false, profil_distribusi: true}
      - {nama: rainfall_mtd_mm, tipe: decimal, profil_distribusi: true}
      - {nama: rain_days_mtd,   tipe: integer, profil_distribusi: true}
      - {nama: rainfall_ytd_mm, tipe: decimal, profil_distribusi: true}
